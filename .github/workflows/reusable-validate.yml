name: Validateee
on:
  workflow_call:

jobs:

  validate:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        name: Checkout

      - uses: subosito/flutter-action@v2
        name: Install Flutter
        with:
          channel: stable
          cache: true

      - run: flutter pub get
        name: Download packages

      - run: flutter analyze
        name: Analyze

      - run: flutter test
        name: Unit Tests
