name: PR Validation

on:
  pull_request:

jobs:
  
  validate:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      
      - name: Download packages
        run: flutter pub get
        
      - name: Analyze
        run: flutter analyze
        
      - name: Unit Tests
        run: flutter test